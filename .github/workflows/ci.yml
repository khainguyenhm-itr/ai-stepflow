name: CI

on:
  # Every branch, not just main: work happens on long-lived feature branches here, so gating only
  # `main` meant most commits never ran lint, tests, or the coverage gate.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Audits only what actually ships in the VSIX. Dev-tool advisories (eslint/mocha transitives)
      # would otherwise block every build without affecting a single user.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Coverage (core, gated)
        run: npm run test:coverage

      - name: Coverage (extension host modules under test, gated)
        run: npm run test:coverage-ext

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The VS Code extension host needs a display on Linux; xvfb provides a headless one.
      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration
